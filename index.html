<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betting Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-option">
        <h1>Yokoso Watashi no Betting Site</h1>
        <button id="play">Play the Game</button>
        <button id="instruction">Instruction</button>
        <button id="bank">Bank</button>
        <button id="status">Check Status</button>
        <button id="exit">Exit</button>
        <p>1. One correct guess out of 3 will result in loss of 10000
           2. All correct guess will result in gain of 100000 :(
           3. All wrong will result in loss of 50000
           4. 2 correct result in the gain of 10000</p>
           
    </main>
    <script src="script.js"></script>
</body>
